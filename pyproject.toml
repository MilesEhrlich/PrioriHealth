[project]
name = "triage-debate"
version = "0.1.0"
description = "Persona-based multi-agent debate for ED triage with disagreement-based human escalation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.1",
    "numpy>=1.26",
    "plotly>=5.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "httpx>=0.27",
    "ibm-watsonx-ai>=1.1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Slide PNG export (needs Chrome; run on a Mac/PC, not on LinuxONE).
charts = ["kaleido>=1.0"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_debate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv]
package = false  # scripts/tests import from src/ directly (avoids macOS hiding the editable .pth)
